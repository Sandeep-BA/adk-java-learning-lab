# Author: Sandeep Belgavi
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "belgavi-adk-learning-lab"
version = "0.1.0"
description = "Python companions to Sandeep Belgavi's Java-first ADK video lessons"
authors = [{name = "Sandeep Belgavi"}]
requires-python = ">=3.11"
dependencies = ["google-adk==2.12.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.1"]

[project.scripts]
belgavi-adk = "belgavi_adk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
